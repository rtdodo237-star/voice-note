# 갤럭시(안드로이드) 설치파일 자동 빌드
# main 브랜치에 코드가 올라가면 GitHub 클라우드에서 APK를 만들어 Releases에 올린다.
# 폰에서 GitHub 저장소 → Releases → 최신 APK 다운로드 → 설치
name: Android APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK 설정
        uses: android-actions/setup-android@v3

      - name: 라이브러리 설치
        run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 안드로이드 프로젝트 생성
        run: npx expo prebuild --platform android --no-install --clean

      # 매 빌드를 같은 키로 서명해야 기존 앱 위에 '업데이트'로 설치됨 (녹음 데이터 유지)
      - name: 고정 서명키 적용
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 없습니다. 서명키 없이 빌드하면 업데이트 설치가 안 되므로 중단합니다."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/debug.keystore

      - name: APK 빌드
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 파일 이름 정리
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/voice-note-1.0.${BUILD_NUMBER}.apk"

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: voice-note-apk
          path: dist/*.apk

      - name: Releases에 게시
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 녹음 노트 1.0.${{ github.run_number }}
          body: |
            갤럭시용 설치파일입니다.
            폰에서 아래 APK를 눌러 다운로드 → 설치하세요.
            (처음 한 번 '출처를 알 수 없는 앱 설치' 허용 필요)
          files: dist/*.apk
          make_latest: true
